[project]
name = "tnf-binder"
version = "0.1.0"
description = "Conditional TNF-alpha binder design, gated by independent verifiers"
requires-python = ">=3.11"
dependencies = ["biopython>=1.83", "numpy>=1.26", "touchstone"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
# Reuse the repo's existing verifier vocabulary (Verdict, the Verifier protocol) rather than
# defining a parallel one. The through-line is that the verifier is the asset; sharing the
# abstraction is what makes that concrete across projects.
touchstone = { path = "../touchstone", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tnf_binder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
