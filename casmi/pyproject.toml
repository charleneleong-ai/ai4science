[project]
name = "casmi"
version = "0.0.1"
description = "Molecule-disjoint evaluation harness for Enveda CASMI 2026"
requires-python = ">=3.11"
# rdkit pinned exactly: 2025.9.3 is the last release with macOS x86_64 wheels (cp310-cp314).
# 2025.9.6 and later ship only arm64 for macOS, so a floating pin breaks on Intel macs.
dependencies = ["pyarrow>=16", "typer>=0.12", "rich>=13", "rdkit==2025.9.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
casmi = "casmi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casmi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
