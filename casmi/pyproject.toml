[project]
name = "casmi"
version = "0.0.1"
description = "Molecule-disjoint evaluation harness for Enveda CASMI 2026"
requires-python = ">=3.11"
dependencies = ["pyarrow>=16", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
casmi = "casmi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casmi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
