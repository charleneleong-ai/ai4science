# One row per experiment, added when its verdict lands. Rendered by the artifact page, the
# progress plot, the W&B report and any companion dashboard, so this file is the single source
# for all of them.
#
# verdict: PROMOTE (shipped, set a new best) | KEEP (kept for later) | DISCARD (closed)
#          | RUNNING
#
# score/submission: present only on an entry that reached the leaderboard, and the only
# numbers here that cannot be derived locally. Oldest first; the last one is the current
# standing, which is what the artifact page quotes and what the progress plot plots.

gates:
  G0: >-
    The cost model is calibrated: measuring the competition's own sample_submission/
    scores 1.0000 to four decimal places, and the measured numbers are written into a
    calibration JSON with measured=true. Nothing downstream is trustworthy until this
    passes, and `vqcc` says so on every run until it does.
  G1: >-
    A local change beats the current submitted baseline by more than that task's measured
    across-seed noise, established from five independent verifier seeds. The threshold is
    per-task, not global: `dfthcsos` and `invsqrt` are deterministic to ~1 ppm, so any
    consistent gain clears it, while `dqi` moves in a 4,589 ppm step and needs G2 instead.
  G2: >-
    For dqi, the gain holds as a reduction in *expected* failures across >= 48 independent
    draws, not on the single draw seeded by the candidate file's own hash.
  G3: >-
    The improvement survives an external leaderboard submission, not only the local
    verifier at its default salt.

experiments:
  - name: g0-calibrate-the-cost-model
    date: 2026-10-31
    baseline: >-
      third-party task ratios from Kaggle discussion topic 754174 (invsqrt 20.57,
      dqi 60.59, dfthcsos 9.93), the only numbers available before the data downloaded
    gate: G0
    result: >-
      Ran all three shipped verifiers over sample_submission/ at the default salt. All
      PASS; reference costs are invsqrt 2,076,774.23 (Q=260, C=7,987.59, 200,540,928
      shots), dqi 2.4439463583673e13 (Q=1,893, T=5,725,108.38, 102,400 shots) and
      dfthcsos 3,355,599,588.32 (lambda_eff=49.3014, T=93,237, Q=730, 254,464 shots).
      The reference blend scores 1.00000 by construction. Reading the verifiers also
      corrected three things the Evaluation page omits: a rotation costs
      0.56*log2(1/eps)+5.3 T at a single circuit-wide eps chosen from the leftover
      accuracy budget (not a per-Clifford-level price); the scored Toffoli figure is the
      simulated per-shot mean, not the static count; and dqi's eps_plus is a
      Clopper-Pearson upper bound at delta=2^-128, so a decoder that fails 0 of 102,400
      shots still pays R=1.1913. Every cost function now reproduces its verifier's own
      score to 1e-12 from the fields that verifier reports, pinned by tests over the
      three captured outputs. The back-derived estimates turned out 0.02%, 0.006% and
      0.04% low, so the public frontier's self-reported numbers held up.
    verdict: PROMOTE
    pr: 102
  - name: v1-reference-submission
    date: 2026-10-31
    score: 1.00000
    submission: 57824925
    baseline: none -- first submission, establishing that the pipeline reaches the leaderboard
    gate: G3
    result: >-
      Submitted the unmodified sample_submission/ as submission 57824925 to confirm the
      upload path end to end and to check that the leaderboard agrees with the local
      verifier on a known input. Scored **1.00000**, exactly the local verifier's 1.00000.
      So the local loop and the leaderboard agree to five decimals on a known input, and
      the dev set can be trusted to rank candidates without spending submissions. Two
      incidental findings: a submission file must be named exactly `submission.zip` (two
      70 MB uploads were rejected with a 400 before the body was read, neither counting
      against the daily budget), and the seed is derived from the candidate's own hash,
      so comparing candidates locally requires an explicit --seed.
    verdict: PROMOTE
    pr: 102
  - name: g0b-read-the-field
    date: 2026-10-31
    baseline: >-
      the third-party summary of the standings (frontier 23.14, leader 26.76, 1,729 teams)
      from Kaggle discussion topic 754174, the only view of the field until now
    gate: none -- an observation, not an experiment
    result: >-
      Pulled the competition's own public leaderboard (1,756 teams) instead of relying on the
      third-party summary, and snapshotted scores-only to
      docs/experiments/leaderboard-2026-10-31.json. Three corrections. (1) **The field is
      bimodal**: p10 23.23, p25 23.04, p50 22.66, then a cliff to p75 7.93 and p90 1.06, so
      half the field is packed into a 0.6-wide band and only 9 teams have cleared 25. A crowd
      that dense at one value is a crowd running one shared parameterisation, which is direct
      evidence for the design doc's reason to prefer dfthcsos. (2) **23.14 is not the
      frontier** -- it is rank ~374 of 1,756, the top edge of the plateau. (3) Our 1.00000 is
      **rank 1,671-1,751**, tied with 80 other teams that submitted the reference unchanged;
      the gap to the leader is x26.8 on score, x19,000 on the product of the three cost
      ratios. The question worth answering is what the 9 teams above 25 found, not how to
      reach 23.
    verdict: KEEP
    pr: 102
  - name: v2-plateau-parts-assembly
    date: 2026-10-31
    score: 23.18119
    submission: 57834335
    baseline: >-
      our own 1.00000 reference submission 57824925, rank 1,671-1,751 of 1,756
    gate: G3
    result: >-
      Reached the plateau by assembly rather than by compression: the public parts market
      (manwithacat/vqcc-apache-public-circuits, 142 Apache-2.0 circuits all re-verified with
      the official verifier) carries a better circuit for each of the three tasks, so the best
      per-task picks were fetched, SHA-256 checked against the dataset manifest, and scored
      locally before spending a submission. All three PASS; the local blend was 23.1811976 and
      submission 57834335 scored **23.18119** on the leaderboard -- agreement to every digit
      either is reported to, so the local dev set predicted the leaderboard a second time, now
      on an input it had never seen. That is rank **249-252 of 1,756** in the 2026-10-31
      snapshot (four other teams share the exact score), up from the 81-team block at 1.00000
      ranked 1,671-1,751, and 125 places above the 23.13587 blend quoted on 2026-10-30. We
      wrote none of these circuits; provenance and credit for all nine authors are in
      57834335-parts.yaml, which also records that the parts published since that quote are
      cheaper on all three tasks -- their authors made them cheaper, we picked newer ones.
      The finding that matters more than the score is the chemistry part's **headroom, which
      is nearly gone**: the accuracy term sits at 99.999084% of the 20 mHa cap and E_gap
      clears its strict floor by 1.03e-6 Ha -- two of the four rejecting constraints spent to
      within 0.1% of their limit -- while the widest ANGLE circuit is 126 of 128 qubits (98.4%)
      and the one-norm Lambda is the only one with real room, at 6.1x its floor. So the
      0.6-wide band half the field sits in is a constraint, not a fashion: tuning this shape is
      finished, and a further dfthcsos gain needs a different factorization.
      **Which factorization is exactly what this does not establish.** The part's reported
      shape is R=8, B=143, C=60 -- the author's own figure from the dataset manifest, not our
      measurement -- and cost scales with R*B while the accuracy reachable at a shape is bounded
      by R*C, so the two are not optimised at the same point. Reproducing the cost-precision
      atlas and fitting factorizations ourselves is the next experiment; the bar is this
      submission's R*B = 1,144 at R*C = 480.
      Incidentally this settles the MIN_LAMBDA reading: this submission's lambda_eff is 48.293,
      below MIN_LAMBDA=49.0, and it passes -- because the constraint floors the one-norm Lambda
      (299.82 here, 6.1x the 49.0 floor), not lambda_eff. The hedge in cost.py's annotation,
      which noted the reference's lambda_eff of 49.30 sat 0.6% above the floor by coincidence
      and so could not discriminate the two readings, is retired.
    verdict: PROMOTE
    pr: 102
  - name: g0c-re-derive-the-reference-factorization
    date: 2026-11-01
    baseline: >-
      no measurement at all -- a claimed reference shape of (65, 60, 60) was cut from PR 102's
      own review as sourced nowhere, leaving the cost-versus-capacity comparison unmakeable
    gate: none -- a derivation from the shipped verifier, not an experiment
    result: >-
      The shape is in the verifier, not in its JSON report, which is why reading the report
      alone could not find it. `scoreinfra/reference.py` declares
      `BASELINE_SHAPE = (65, 60, 60)  # (R, B, C) of the provided baseline factorization`, and
      the same file documents the submitted arrays as `U` (R, B, N) and `W` (R, B, C). The
      sample submission's npz agrees exactly -- `U` is (65, 60, 76) and `W` is (65, 60, 60) --
      so **the reference factorization is R=65, B=60, C=60**, and the cut claim was right
      about the numbers while wrong about having a source. Two independent checks confirm the
      axis reading rather than inferring it from one file. First, the plateau part's npz is
      `U` (8, 143, 76) and `W` (8, 143, 60), matching the R=8/B=143/C=60 its author declared
      in the dataset manifest, so the manifest's vocabulary and the verifier's are the same
      one. Second, `verify.py` computes the LCU vector count as `num_orbitals + R*B`, which
      reproduces both files' `angle_words` row counts exactly: 76 + 65x60 = 3,976 for the
      reference and 76 + 8x143 = 1,220 for the plateau part.
      So the comparison the design doc wanted can now be made. The plateau part reaches its
      cost by **cutting the rank from 65 to 8 while widening the basis from 60 to 143**: 3.26x
      fewer LCU vectors (3,976 to 1,220), Toffolis 93,237 to 16,266 and width 730 to 430. What
      it pays is ensemble capacity, R*C, which falls 8.1x from 3,900 to 480 -- and that is
      visible as the accuracy it has spent: its Hamiltonian error sits at 99.999% of the
      20 mHa cap where the reference sits at 93.2%. **Low rank is what the plateau found, and
      the accuracy cap is what stops it going lower.** Not established: whether a shape exists
      that is both cheaper than R*B = 1,144 and still under the cap -- that needs the
      cost-precision atlas reproduced and factorizations fitted, which is the next experiment,
      not this one.
    verdict: KEEP
    pr: 102
  - name: g1-size-the-across-seed-noise
    date: 2026-11-01
    baseline: >-
      the submitted plateau assembly (submission 57834335, leaderboard 23.18119), re-verified
      unchanged under `--seed 1..5`
    gate: >-
      none -- this experiment *is* gate G1's measurement, and it rewrote G1's own definition
    result: >-
      Re-verifying one unchanged submission under five verifier seeds splits the three tasks
      into two regimes, which is the result: **`dfthcsos` is bit-identical across all five
      seeds (337,780,864.96, spread exactly 0) and `invsqrt` varies by 0.84 ppm, while `dqi`
      varies by 4,589 ppm** and carries the entire 1,527 ppm (0.0354 absolute) spread of the
      blended score, 23.145825 to 23.181206.
      The mechanism is not Gaussian noise but **a single discrete step**. Seeds 1, 2, 3 and 5
      recorded `empirical_error_rate = 0.0` and therefore identical numbers to every digit:
      one-sided bound `effective_error_rate = 8.6606e-4` and `repetition_factor = 1.19126`.
      Seed 4 recorded `empirical_error_rate = 9.765625e-06`, which is exactly **1 / 102,400 --
      one failed shot** -- lifting the Clopper-Pearson bound to 9.1042e-4 and the repetition
      factor to 1.19673, a +0.459% cost penalty. Everything else held still: the simulated
      per-shot `toffoli_count` moved only in its seventh digit (427,935.3 +/- 0.1, 0.45 ppm)
      and `num_qubits = 888` was constant. So `dqi`'s variance is carried entirely by whether
      the decoder drops a shot, and the answer is 0 or 1, not a continuum.
      Five seeds size that step precisely and its frequency badly. One failure in 5 x 102,400
      = 512,000 shots puts the per-shot failure probability near 1.95e-6, so a 102,400-shot
      run should see at least one failure about 18% of the time -- but the 95% interval on
      that frequency, from 1 of 5 runs, is [0.5%, 71.6%]. **The step is measured; its
      probability is not.**
      Two consequences, both of which change what we do next. First, a chemistry change can
      be judged on a single seed: `dfthcsos` is deterministic, so there is no noise allowance
      to clear at all, and the atlas experiment needs no replication budget. Second, the
      leaderboard draws its own seed, so **our 23.18119 was a zero-failure draw and
      resubmitting the identical file could legitimately return ~23.1458**. A `dqi` gain
      smaller than 0.035 blend points therefore cannot be confirmed by one submission, which
      is exactly what G2 already demanded -- it now has a measured number behind it instead of
      a precaution. Cost: 5 runs x ~7 min.
    verdict: KEEP
    pr: 102
  - name: r1-price-the-factorization-refit
    date: 2026-11-02
    baseline: >-
      the submitted plateau factorization (submission 57834335, chemistry cost 337,780,865 at
      lambda_eff 48.293182, Lambda 299.823549), which G0c left as "needs a different
      factorization" and this experiment was meant to refit
    gate: >-
      none -- a reach calculation done before spending compute, per the rule that a change
      whose best case is below what the decision needs must not be run
    result: >-
      The experiment queued after G0c was an L1-regularised refit of the THC factors at fixed
      shift -- the one lever the verifier leaves open, since `load_inputs` calls
      `load_fixed_shifts()` and overwrites any submitted `H1_I`/`Hsym_lower`, closing the joint
      shift optimisation the recent literature leans on hardest. **Pricing it first closed
      it.** Writing `D = 2*Lambda - E_gap` out in full cancels the negative eigenvalue mass and
      leaves `D = 2P + 2*(lambda_h2 - sum(W^2)/4) - c0` with both leading terms provably
      non-negative, so `D >= -c0` -- and `c0` is fixed by the reference Hamiltonian and the
      frozen shift. At `c0 = -559.132473` that is **93.86% of the submitted D of 595.73**,
      putting the floor at `lambda_eff >= 46.786180` against 48.293182: **3.121%**, worth
      **+0.243 blend** against the **+1.82** that 25.0 needs, and unreachable at that (it needs
      `w = 0`, which destroys error_2). A realistic halving of the movable part gives +0.11.
      So the plateau is not merely at a local optimum of this objective; the objective has
      almost no range, and no refit can lift this score materially. Verified against the
      shipped verifier on the submitted factorization -- identity exact to 0.0, all 480 excess
      terms positive, excess recovered to 2e-14 -- and pinned by `min_lcu_lambda` /
      `lambda_eff_floor` in cost.py with tests in test_cost.py and test_chemistry.py, printed
      on every `vqcc chem` run. Derivation, literature sweep and what remains unmeasured:
      reports/2026-11-02-thc-factorization-sota.md. Cost: no compute.
      Two corrections fall out. The one-norm was recorded in G0c as the knob with "real room,
      at 6.1x its floor" -- that floor was the `MIN_LAMBDA = 49.0` rejection rule, which never
      binds; against the derived floor of 281.52 the submitted Lambda sits at **1.065x**, the
      least room of the four constraints, not the most. And a `W` scan that appeared to show
      `error_1` pinning `W` had held the submitted one-body rows fixed; `error_1` compares those
      rows against the exact eigenvectors of `h1_prime` and is decoupled from every scored
      quantity, so a refit recomputes them and it returns to its quantisation floor.
      With the leading factor floored, the chemistry cost is `T * Q` and essentially nothing
      else. Pricing one Toffoli in error budget is the next measurement and may come back at
      zero.
    verdict: DISCARD
    pr: 104
  - name: r2-price-the-toffoli-budget
    date: 2026-11-02
    baseline: >-
      the submitted plateau submission 57834335 at T_total 16,266 and Q_total 430, whose
      chemistry cost r1 left as "T * Q and essentially nothing else"
    gate: >-
      none -- the same reach calculation as r1, run before spending compute
    result: >-
      With `lambda_eff` floored, the question was what `T` and `Q` are made of and which parts
      a submission can actually move. Driving the verifier's own `SpinFreeData_V1` at the
      submitted shape reproduces both recorded totals **exactly**: `T = 16,266` splits into
      **8,336 ANGLE Toffolis (51.25%)** plus a heuristic 7,930 (inner state prep 5,311, Givens
      rotations 2,250, outer 369), and `Q = 430` into 304 shared workspace, 86 persistent
      state-prep qubits and 40 angle-word registers (`J = 5` back-solved from Q, times
      `brot = 8`). **The split is the finding.** Everything heuristic is closed-form in the
      shape `(R, B, C)` and `brot`, so it can only be bought with error budget -- and the
      error budget is spent, both residuals sitting at 99.999% of the 20 mHa cap. The ANGLE
      Toffolis are the simulated mean of circuits the submitter writes, so cheaper loaders for
      the *same* words score better at *identical* accuracy. Half of `T` costs nothing.
      Price: one Toffoli is **+0.000475 blend**, one qubit **+0.017998** (38x a Toffoli, since
      `Q` is 38x smaller). Reaching 25.0 needs **20.28% off the chemistry cost** -- 3,298
      Toffolis, or 87 qubits, or any mix. From the free share alone that is a **39.6% cheaper
      ANGLE family**: large, but the only direction left that costs no accuracy. The parts record
      has this submission reusing its predecessor's loaders byte-identical, on "the existing
      16,266-Toffoli loaders"; whether anyone on the leaderboard has rewritten them is unknown.
      Three ways of buying the bought part were measured and all are closed. **brot cannot go
      down**: re-rounding the submitted angles onto the `brot = 7` grid breaches the cap by
      **118x** on error_1 and 22x on error_2, and since the angles already sit on the cap at
      `brot = 8`, no fresh fit at half the grid spacing closes two orders of magnitude.
      **brot cannot go up**: at `brot = 9` the inner preparation's QROAM jumps to a branch that
      takes the shared workspace from 304 to 607 qubits, costing **-3.27 blend** despite
      1,316 fewer Toffolis. **The shape cannot be re-split**: at constant `R*B = 1,144` the
      submitted `(8, 143)` is the best of all 16 integer factor pairs, every other costing
      -0.23 to -16.46. Shapes that are cheaper -- lower `R*B`, or lower `C` -- all cut the
      representational capacity of a factorization already at the accuracy cap.
      Pinned by `ShapeResources` / `ChemistryScreen.resources` in chemistry.py and
      `blend_factor` / `cost_cut_for_blend` in cost.py, printed by `vqcc shape`, with the
      brot wall and both totals under test. Cost: no compute.
    verdict: KEEP
    pr: 104
  - name: r3-crack-the-angle-loaders
    date: 2026-11-03
    baseline: >-
      the submitted plateau submission 57834335's own ANGLE family -- 15 circuits, 8,336
      Toffolis, which r2 left as the one direction that costs no accuracy and priced at
      needing a 39.6% cut to reach 25.0
    gate: >-
      none -- the same reach calculation as r1 and r2, run before writing a single circuit
    result: >-
      **The submitted loaders are not lookup tables.** Each `ANGLE_k` is a GF(2) circuit: a
      ladder of AND-ancillas, then ~33,500 CNOTs fanning their products into the word bits,
      then `HMR` plus conditioned `CZ` uncomputing every ancilla at Clifford cost. Of circuit
      13's 33,540 CNOTs, **27,444 target the selection register itself**, used in place as a
      linear scratchpad and restored by the end; 183 of its 258 Toffolis write straight into
      word bits and 75 build reusable ancillas. Since `recover_words_from_circuits` charges
      Toffoli-like gates only -- and "a conditioned gate counts only on the shots whose bit is
      set", so the measurement-based uncompute is free -- **XOR costs nothing and the AND gates
      are the entire bill**. A loader's price is the multiplicative complexity of its word
      table, not its address count.
      Rebuilding the same `angle_words` three ways sizes that construction: kickmix's own
      `init_lookup` costs **30,690** Toffolis per pass over the family (2,046 per circuit, 62
      qubits), the starter kit's segment-tree QROM with Qualtran's `_break_early` costs
      **18,270** (1,218 per circuit, 61 qubits), and the submitted family costs **4,168**
      (258-301 per circuit, 126 qubits). So the plateau is already **7.4x cheaper than the
      library primitive and 4.4x cheaper than the starter kit**, bought with 65 extra workspace
      qubits, and it is nobody's default -- it is a hand-built construction.
      **How much is left is a counting question.** A straight-line GF(2) circuit with `n`
      inputs, `A` AND gates and `b` outputs realises at most
      `2**(2An + A**2 + A + b*(n + A + 1))` distinct maps, while a family member must reproduce
      a specific `b`-bit word on each of 1,220 addresses -- one of `2**(b*1220)` tables -- so
      all but a vanishing fraction need `A**2 + A*(2n + 1 + b) + b*(n + 1) >= b*1220`. **`n` is
      not 11 but 51**: each circuit runs with its word registers already holding the previous
      batch, itself a function of the address, so a floor must grant them as 40 nonlinear
      inputs. At `b = 40` that gives **A >= 157**, against **191** for the address bits alone.
      The submitted circuits never use them: simulated gate by gate from a zeroed register,
      every circuit still adds exactly the right delta, so their 277.9 mean is 1.45x the
      address-only bound and 1.770x the granted one. Using them is harder than it looks: the
      reverse pass runs the same circuit from this batch back to the previous one, so a delta
      read off the registers must agree from both.
      **The floor rises with the batch size `J`; the construction falls.** Every loader keeps
      a pool of address functions in its workspace -- selection bits plus an AND ladder -- and
      writes each output bit as a sum of products of two pool combinations, about
      `1220 / (2 * pool)` of them per bit. That model, calibrated once (0.784x) to the measured
      family, prices every batching. The word registers eat the pool -- J=13 leaves 13
      workspace qubits -- so **re-batching is no lever**: best is J=4 at +0.024, inside the
      model's error, and J=13 is -5.69. Correction: an earlier revision held the 1.770x rate
      fixed across `J` and read **+1.041 at J=13** off it; the floor ignores width, and that
      rate is unreachable once the pool is gone.
      **So the floor's escape band is a statement about word-reading constructions only.**
      It permits 25.0 at every `J >= 5` (best J=11 at 25.684; 25.957 with `lambda_eff` at its
      own floor too), but at J=5, 25.0 needs **168 ANDs per circuit, below the address-only
      bound of 191** -- no construction of the kind anyone has submitted reaches the band
      through the loaders. Each 20 ANDs per circuit saved at J=5 is worth about +0.3.
      Not established: that a loader can read its word registers consistently in both
      directions, or that the pool model -- fitted at J=5 and extrapolated -- holds for
      constructions other than the submitted one.
      Pinned by `and_counting_floor`, `AngleFamily` (with `pool_model_ands`),
      `ShapeResources.with_angle_family` and `AngleFloorSweep` in cost.py, printed by
      `vqcc angle-floor`, with tests including the round trip that re-batching the submission
      into its own family reproduces every resource term and 23.18119 exactly. Cost: no
      compute.
    verdict: KEEP
    pr: 104
  - name: r4-cheaper-j5-loader-synthesis
    date: 2026-11-06
    baseline: >-
      the plateau's J=5 ANGLE family, 4,168 Toffolis per pass: per circuit an 80-AND monomial
      cache plus 178 / 199 / 221 product Toffolis (odd k >= 5 / even k >= 4 / k = 0..3)
    gate: >-
      a family cheaper than 4,168 per pass, exact by our own GF(2) simulation forward, in
      reverse and from a zeroed register, with every screened chemistry constraint passing
    result: >-
      **The construction is public and the plateau is its tuned output.** The SOTA sweep traced
      the loaders to Lera's (marculera) `tensorqrom.py` (Apache-2.0): the low 4 address bits'
      monomials (11 ANDs) and the high bits' (69) are cached, and each product Toffoli covers a
      rank-2 term of the word table's mixed ANF tensor (15 x 76 x 35), fanned out to an output
      set by CNOTs. Five probes, none of which clears the gate:
      (1) **No redundant AND**: none of the 4,168 products is in the XOR span of the qubits live
      when it fires, over all 2,048 selection values or over only the 1,220 legal ones.
      (2) **The plateau sits at the generic count**: a rank-2 product has ~212 degrees of
      freedom, so a generic 39,900-entry tensor needs ~188 products; the plateau uses 178 on
      odd circuits. A 60-second Kauers-Moosbauer flip walk took rank 425 to 419 only.
      (3) **The vendored planner gives 277 ANDs on circuit 13 against the plateau's 258**,
      exact under our simulator -- the plateau's 19 extra ANDs of tuning come from kernel
      relations and search we have not reproduced.
      (4) **A wider low cache is far worse**: lowbits 5 gives 495 and lowbits 6 gives 958 on
      circuit 13; the planner's sharing heuristic does not survive the larger feature space.
      (5) **The product counts are set by coded bits**: deltas k >= 4 have bit 0 affine on
      every 16-address block, odd k >= 5 bit 1 too, worth ~22 products per plane. Extending
      bit 0 to circuits 1..3 flips 4,382 of 18,300 entries by one LSB and is **rejected by the
      screen: Hamiltonian error 1.046 against 0.02**, lambda_eff 48.29 -> 60.25 -- batches 0..2
      hold the Givens tree's root edges.
      Dead angle words (rotations acting on zero amplitude, replayed from the verifier's own
      recurrence) are 1,654 of 91,500 entries, scattered single cells; the public trend for
      exploiting them is -1 to -7 Toffolis per circuit.
      Not established: what the plateau's kernel-relation search does exactly, or whether a
      decomposition search seeded from its own circuits finds products the planner missed.
      Cost: ~4 CPU-hours, no submissions.
    verdict: DISCARD
    pr: 105
